<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClawBuildr — Setup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',500:'#6366f1',600:'#4f46e5',700:'#4338ca' },
            ink: { 900:'#0f172a', 700:'#334155', 500:'#64748b', 400:'#94a3b8' }
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { background: #f4f5f7; color: #334155; margin: 0; }
    .fade-in { animation: fadeIn .28s ease; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:none;} }
    input:focus, textarea:focus, select:focus { outline: none; box-shadow: 0 0 0 3px rgba(79,70,229,.15); border-color:#4f46e5 !important; }

    /* Top stepper (Skylead-style) */
    .stepper { display:flex; align-items:center; gap:0; width:100%; }
    .step-item { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
    .step-item:last-child { flex:0; }
    .step-dot {
      width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-size:12px; font-weight:600; background:#e2e8f0; color:#64748b; flex-shrink:0; transition:.2s;
    }
    .step-item.active .step-dot { background:#4f46e5; color:#fff; box-shadow:0 0 0 4px rgba(79,70,229,.15); }
    .step-item.done .step-dot { background:#0f172a; color:#fff; }
    .step-label { font-size:13px; font-weight:600; color:#94a3b8; white-space:nowrap; }
    .step-item.active .step-label { color:#0f172a; }
    .step-item.done .step-label { color:#334155; }
    .step-line { flex:1; height:2px; background:#e2e8f0; margin:0 12px; min-width:24px; }
    .step-item.done .step-line, .step-item.active .step-line { background:#4f46e5; }

    /* Choice cards (Meta-style) */
    .goal-card {
      position:relative; text-align:left; background:#fff; border:1.5px solid #e2e8f0; border-radius:14px;
      padding:20px 18px 18px; cursor:pointer; transition:.15s; width:100%;
    }
    .goal-card:hover { border-color:#c7d2fe; background:#fafaff; }
    .goal-card.selected { border-color:#4f46e5; background:#eef2ff; box-shadow:0 0 0 1px #4f46e5; }
    .goal-card .radio {
      position:absolute; top:14px; right:14px; width:18px; height:18px; border-radius:50%;
      border:2px solid #cbd5e1; background:#fff;
    }
    .goal-card.selected .radio { border-color:#4f46e5; background:#4f46e5; box-shadow: inset 0 0 0 3px #fff; }
    .goal-icon {
      width:40px; height:40px; border-radius:10px; background:#f1f5f9; display:flex; align-items:center;
      justify-content:center; color:#4f46e5; font-size:16px; margin-bottom:12px;
    }
    .goal-card.selected .goal-icon { background:#fff; }

    .chip {
      cursor:pointer; border:1.5px solid #e2e8f0; border-radius:999px; padding:7px 14px;
      font-size:13px; font-weight:500; color:#475569; background:#fff; transition:.15s;
      display:inline-flex; align-items:center; gap:6px;
    }
    .chip:hover { border-color:#c7d2fe; }
    .chip.selected { border-color:#4f46e5; background:#eef2ff; color:#4338ca; }

    .choice-card {
      cursor:pointer; border:1.5px solid #e2e8f0; border-radius:12px; padding:14px 16px;
      background:#fff; transition:.15s; position:relative; text-align:left; display:block; width:100%;
    }
    .choice-card:hover { border-color:#c7d2fe; background:#fafaff; }
    .choice-card.selected { border-color:#4f46e5; background:#eef2ff; }
    .choice-card .check {
      position:absolute; top:12px; right:12px; width:20px; height:20px; border-radius:50%;
      border:2px solid #cbd5e1; display:flex; align-items:center; justify-content:center;
      font-size:10px; color:transparent;
    }
    .choice-card.selected .check { background:#4f46e5; border-color:#4f46e5; color:#fff; }

    /* Campaign sidebar */
    .side-summary { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:18px; }
    .side-row { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid #f1f5f9; }
    .side-row:last-child { border-bottom:0; }
    .side-icon {
      width:28px; height:28px; border-radius:8px; background:#f1f5f9; color:#64748b;
      display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0;
    }
    .side-row.ok .side-icon { background:#eef2ff; color:#4f46e5; }
    .side-title { font-size:12px; font-weight:600; color:#0f172a; text-transform:uppercase; letter-spacing:.04em; }
    .side-val { font-size:13px; color:#64748b; margin-top:2px; }
    .side-row.ok .side-val { color:#334155; }

    /* Tabs */
    .tab {
      padding:10px 2px; margin-right:24px; font-size:14px; font-weight:600; color:#94a3b8;
      border-bottom:2px solid transparent; cursor:pointer; background:none; border-top:0; border-left:0; border-right:0;
    }
    .tab.active { color:#0f172a; border-bottom-color:#4f46e5; }

    /* Day circles */
    .day-circle {
      width:36px; height:36px; border-radius:50%; border:1.5px solid #e2e8f0; background:#fff;
      font-size:12px; font-weight:600; color:#64748b; cursor:pointer; transition:.15s;
      display:flex; align-items:center; justify-content:center;
    }
    .day-circle:hover { border-color:#c7d2fe; }
    .day-circle.selected { background:#4f46e5; border-color:#4f46e5; color:#fff; }

    /* Sequence flow */
    .flow-canvas {
      background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:28px 24px;
      min-height:460px; overflow:auto; position:relative;
      max-width:720px; width:100%; margin:0 auto; min-width:0;
    }
    .flow-col { display:flex; flex-direction:column; align-items:center; width:100%; max-width:520px; min-width:0; margin:0 auto; }
    .flow-node {
      width:100%; background:#f8fafc; border:1.5px solid #e2e8f0; border-radius:10px;
      padding:12px 14px; display:flex; gap:12px; align-items:center; cursor:grab; transition:.15s;
      text-align:left; position:relative; user-select:none;
    }
    .flow-node:active { cursor:grabbing; }
    .flow-node:hover { border-color:#c7d2fe; }
    .flow-node.selected { border-color:#4f46e5; background:#eef2ff; box-shadow:0 0 0 1px #4f46e5; }
    .flow-node.dragging { opacity:.4; }
    .flow-node.drag-over-top { box-shadow:0 -3px 0 0 #4f46e5; }
    .flow-node.drag-over-bottom { box-shadow:0 3px 0 0 #4f46e5; }
    .flow-node.dark { background:#0f172a; border-color:#0f172a; color:#fff; }
    .flow-node.dark.selected { background:#1e293b; border-color:#4f46e5; }
    .node-icon {
      width:36px; height:36px; border-radius:8px; background:#2563eb; color:#fff;
      display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;
    }
    .flow-node.dark .node-icon { background:#334155; }
    .node-title { font-size:13px; font-weight:600; color:#0f172a; }
    .flow-node.dark .node-title { color:#fff; }
    .node-meta { font-size:11px; color:#94a3b8; margin-top:2px; display:flex; align-items:center; gap:4px; }
    .node-grip { color:#cbd5e1; font-size:12px; flex-shrink:0; margin-left:auto; }
    .node-idx {
      width:22px; height:22px; border-radius:999px; background:#e2e8f0; color:#64748b;
      font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .flow-connector { width:2px; height:22px; background:#cbd5e1; position:relative; }
    .flow-connector::after {
      content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
      width:8px; height:8px; background:#94a3b8; border-radius:1px; rotate:45deg;
    }
    .branch-row { display:flex; width:100%; justify-content:center; gap:48px; position:relative; }
    .branch-row::before {
      content:''; position:absolute; top:0; left:20%; right:20%; height:2px; background:#cbd5e1;
    }
    .branch-col {
      display:flex; flex-direction:column; align-items:center; flex:1; max-width:200px;
      background:#fff; border:1px dashed #e2e8f0; border-radius:10px; padding:6px 8px 8px; cursor:pointer;
      transition:.15s; position:relative;
    }
    .branch-col:hover { border-color:#c7d2fe; background:#fafaff; }
    .branch-col.yes-hl { border-color:#16a34a; background:#f0fdf4; }
    .branch-col.no-hl { border-color:#dc2626; background:#fff1f2; }
    .branch-col.drag-over-yes { border-color:#16a34a; border-style:solid; background:#dcfce7; box-shadow:0 0 0 2px #16a34a44; }
    .branch-col.drag-over-no { border-color:#dc2626; border-style:solid; background:#ffe4e6; box-shadow:0 0 0 2px #dc262644; }
    .branch-col .drop-label {
      display:none; font-size:10px; font-weight:700; color:#0f172a;
      background:#fff; border:1px solid #e2e8f0; border-radius:999px; padding:2px 8px; margin-top:4px;
    }
    .branch-col.drag-over-yes .drop-label,
    .branch-col.drag-over-no .drop-label { display:block; }
    .branch-badge {
      width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-size:10px; color:#fff; margin:6px 0; z-index:1;
    }
    .branch-badge.yes { background:#16a34a; }
    .branch-badge.no { background:#dc2626; }
    .flow-start {
      background:#fff; border:1px dashed #cbd5e1; border-radius:8px; padding:8px 16px;
      font-size:12px; font-weight:600; color:#64748b;
    }
    .diamond {
      width:44px; height:44px; background:#0f172a; rotate:45deg; border-radius:6px;
      display:flex; align-items:center; justify-content:center; margin:0 auto;
    }
    .diamond span { rotate:-45deg; color:#fff; font-size:14px; }
    .cond-node {
      width:100%; background:#f8fafc; border:1.5px solid #e2e8f0; border-radius:10px; padding:10px 14px;
      cursor:grab; user-select:none; display:flex; align-items:center; gap:12px; transition:.15s;
    }
    .cond-node:active { cursor:grabbing; }
    .cond-node.selected { border-color:#4f46e5; background:#eef2ff; box-shadow:0 0 0 1px #4f46e5; }
    .cond-node.dragging { opacity:.4; }
    .branch-label-row {
      display:flex; justify-content:center; gap:16px; width:100%; margin-top:2px;
      font-size:11px; font-weight:600;
    }
    .branch-target-chip {
      max-width:46%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      padding:2px 8px; border-radius:999px; background:#f1f5f9; color:#64748b;
    }
    /* Full-bleed sequence mode */
    body.seq-mode .layout-shell { max-width:none; padding-left:8px; padding-right:8px; }
    body.seq-mode .layout-shell .grid-main { display:block !important; }
    body.seq-mode #sidebar { display:none !important; }
    .seq-layout { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; align-items:start; }
    @media (min-width:1100px) {
      .seq-layout { grid-template-columns:minmax(0,1fr) 340px; }
    }
    .seq-layout > * { min-width:0; }
    .seq-toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .drop-hint {
      font-size:11px; color:#94a3b8; text-align:center; margin-top:10px;
    }

    .seq-panel { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:20px; }
    .num-input {
      display:flex; align-items:center; border:1px solid #e2e8f0; border-radius:10px; overflow:hidden; background:#f8fafc;
    }
    .num-input input {
      width:100%; border:0; background:transparent; padding:10px 12px; font-size:14px; font-weight:600;
      color:#0f172a; text-align:center;
    }
    .num-input button {
      width:36px; height:40px; border:0; background:#fff; color:#64748b; font-size:16px; cursor:pointer;
      border-left:1px solid #e2e8f0;
    }
    .num-input button:last-child { border-left:0; border-right:0; border-right:1px solid #e2e8f0; }
    .num-input button:hover { background:#f1f5f9; color:#0f172a; }

    .review-box { background:#f8fafc; border:1px solid #e2e8f0; border-radius:14px; padding:22px 24px; }
    .review-row { display:flex; justify-content:space-between; gap:16px; padding:11px 0; font-size:14px; }
    .review-row + .review-row { border-top:1px solid #eef2f7; }
    .review-label { color:#64748b; }
    .review-val { font-weight:600; color:#0f172a; text-align:right; }

    .btn-primary {
      background:#4f46e5; color:#fff; border:0; border-radius:999px; padding:12px 28px;
      font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 4px 14px rgba(79,70,229,.25);
      transition:.15s;
    }
    .btn-primary:hover { background:#4338ca; }
    .btn-primary:disabled { opacity:.6; cursor:not-allowed; }
    .btn-ghost {
      background:transparent; border:0; color:#64748b; font-size:14px; font-weight:600;
      cursor:pointer; padding:10px 8px;
    }
    .btn-ghost:hover { color:#0f172a; }
    .btn-outline {
      background:#fff; border:1px solid #e2e8f0; border-radius:999px; padding:11px 22px;
      font-size:14px; font-weight:600; color:#334155; cursor:pointer;
    }
    .btn-outline:hover { border-color:#c7d2fe; }

    .panel-card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:28px; }
    .section-label {
      font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
      color:#94a3b8; margin:0 0 10px;
    }
    .field-label { font-size:13px; font-weight:600; color:#334155; display:block; margin-bottom:6px; }
    .field-input {
      width:100%; border:1px solid #e2e8f0; border-radius:10px; padding:11px 14px; font-size:14px;
      color:#0f172a; background:#fff;
    }
    .field-input::placeholder { color:#94a3b8; }
    textarea.field-input { resize:vertical; min-height:96px; }
    .hint { font-size:12px; color:#94a3b8; margin-top:6px; }
    .progress-track { height:6px; background:#e2e8f0; border-radius:999px; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,#6366f1,#4f46e5); border-radius:999px; transition:width .4s ease; }
  </style>
</head>
<body class="min-h-screen">
  <div class="layout-shell max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <!-- Header -->
    <div class="text-center mb-6">
      <div id="tenant-pill" class="hidden mb-3 text-[12px] text-ink-500"></div>
      <h1 class="text-2xl sm:text-[26px] font-bold text-ink-900">ClawBuildr instellen</h1>
      <p class="text-ink-500 mt-1 text-[15px]">In 2 minuten je outbound campagne live.</p>
    </div>

    <!-- Progress -->
    <div class="mb-6">
      <div class="flex justify-between text-[12px] font-semibold text-ink-400 mb-2">
        <span id="progress-label">Stap 1 van 5</span>
        <span id="progress-pct">17%</span>
      </div>
      <div class="progress-track"><div id="progress-bar" class="progress-fill" style="width:17%"></div></div>
    </div>

    <!-- Stepper -->
    <div id="stepper" class="mb-6 hidden sm:block"></div>

    <div class="grid grid-cols-1 lg:grid-cols-[1fr_280px] gap-5 items-start grid-main">
      <!-- Main panel -->
      <div id="card" class="panel-card fade-in min-h-[520px] flex flex-col"></div>

      <!-- Campaign sidebar -->
      <aside id="sidebar" class="side-summary hidden lg:block sticky top-6"></aside>
    </div>
  </div>

  <script>

    const PHASE_OF = {

    function asArr(v) {
      if (Array.isArray(v)) return v;
      if (typeof v === 'string' && v.trim()) {
        if (v.trim().startsWith('[')) { try { return JSON.parse(v); } catch (e) {} }
        return v.split('\n').map(s => s.trim()).filter(Boolean);
      }
      return [];
    }

    function normalizeSeq(s, i) {
      const kind = s.kind || 'message';
      let out;
      if (kind === 'condition') {
        const armVal = (v) => {
          if (v === 'stop') return 'stop';
          if (v === undefined || v === '' || v === null || v === 'null' || v === 'undefined') return null;
          return Number.isFinite(Number(v)) ? Number(v) : null;
        };
        out = {
          kind:'condition', title: s.title || 'If replied',
          delay_days: Number(s.delay_days ?? 0), delay_hours: Number(s.delay_hours ?? 0),
          condition: String(s.condition || 'email_replied'),
          on_true: armVal(s.on_true),
          on_false: armVal(s.on_false),
          branch: s.branch
        };
      } else if (kind === 'wait') {
        out = {
          kind:'wait', title: s.title || 'Wait',
          delay_days: Number(s.delay_days ?? 0), delay_hours: Number(s.delay_hours ?? 0),
          branch: s.branch
        };
      } else if (kind === 'linkedin_connect') {
        out = {
          kind:'linkedin_connect', title: s.title || 'LinkedIn connectieverzoek',
          delay_days: Number(s.delay_days ?? 0), delay_hours: Number(s.delay_hours ?? 0),
          note: String(s.note || ''), branch: s.branch
        };
      } else if (kind === 'linkedin_message') {
        out = {
          kind:'linkedin_message', title: s.title || 'LinkedIn DM',
          delay_days: Number(s.delay_days ?? 0), delay_hours: Number(s.delay_hours ?? 0),
          message: String(s.message || ''), tone: String(s.tone || 'gentle'), branch: s.branch
        };
      } else {
        out = {
          kind: 'message',
          title: s.title || `Follow-up ${i}`,
          delay_days: Number(s.delay_days ?? 0),
          delay_hours: Number(s.delay_hours ?? 0),
          tone: String(s.tone || 'gentle'),
          subject_prefix: String(s.subject_prefix ?? 'Re: '),
          message: String(s.message || ''),
          subject: String(s.subject || ''),
          branch: s.branch
        };
      }
      return clampDelay(out);
    }

    function clampDelay(n) {
      let d = Math.max(0, Math.floor(Number(n.delay_days) || 0));
      let h = Math.max(0, Math.floor(Number(n.delay_hours) || 0));
      d += Math.floor(h / 24);
      h = h % 24;
      n.delay_days = d;
      n.delay_hours = h;
      return n;
    }

    function delayLabel(n) {
      const d = Number(n.delay_days) || 0, h = Number(n.delay_hours) || 0;
      if (!d && !h) return 'direct';
      const parts = [];
      if (d) parts.push(`${d} day${d===1?'':'s'}`);
      if (h) parts.push(`${h} hour${h===1?'':'s'}`);
      return parts.join(' ');
    }

    async function init() {
      try {
        const [statusRes, tenantRes] = await Promise.all([
          fetch('/api/onboarding/status'),
          fetch('/api/config/tenant')
        ]);
        const status = await statusRes.json();
        const tenant = await tenantRes.json();
        mergeTenant(tenant);
        if (status?.data?.step_data) {
          Object.values(status.data.step_data).forEach(mergeStepData);
        }
        if (status?.completed) current = 'running';
        else if (status?.current_step) {
          const mapped = BACKEND_TO_UI[status.current_step] || 'goal';
          current = STEPS.includes(mapped) ? mapped : 'goal';
          if (status.current_step === 'campaign_info' && form.display_name) current = 'company';
          if (status.current_step === 'campaign_info' && !form.campaign_goal && !form.display_name) current = 'goal';
        }
        if (current === 'settings') settingsTab = 'email';
        if (current === 'sequence') selectedSeqIdx = 0;
        if (current === 'review') launchReady = true;
      } catch (e) {
        console.warn('Could not load onboarding state', e);
      }
      await loadConnectStatus();
      await loadTenantSwitcher();
      render();

    async function loadTenantSwitcher() {
      /* Shows which tenant is active + lets you switch (or log out).
         Hides itself when there is only one tenant. */
      try {
        const [listRes, activeRes] = await Promise.all([
          fetch('/api/config/tenants'),
          fetch('/api/config/tenant'),
        ]);
        if (!listRes.ok) return;
        const tenants = await listRes.json();
        if (!Array.isArray(tenants) || tenants.length < 2) return;
        const active = (await activeRes.json().catch(() => ({})))?.tenant_id;
        const pill = document.getElementById('tenant-pill');
        if (!pill) return;
        pill.classList.remove('hidden');
        pill.textContent = '';
        const label = document.createElement('span');
        label.textContent = 'Tenant: ';
        const sel = document.createElement('select');
        sel.className = 'border border-slate-300 rounded px-2 py-0.5 text-[12px] ml-1';
        tenants.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.tenant_id;
          opt.textContent = t.display_name || t.tenant_id;
          if (t.tenant_id === active) opt.selected = true;
          sel.appendChild(opt);
        });
        sel.addEventListener('change', async () => {
          try {
            const res = await fetch('/api/config/tenant/switch/' + encodeURIComponent(sel.value), { method: 'POST' });
            if (res.ok) location.reload();
          } catch (e) { console.warn('tenant switch failed', e); }
        });
        pill.appendChild(label);
        pill.appendChild(sel);
        const sep = document.createElement('span');
        sep.textContent = ' · ';
        pill.appendChild(sep);
        const logout = document.createElement('a');
        logout.href = '#';
        logout.textContent = 'Uitloggen';
        logout.className = 'underline';
        logout.addEventListener('click', async (ev) => {
          ev.preventDefault();
          try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
          window.location.href = '/login';
        });
        pill.appendChild(logout);
      } catch (e) {
        console.warn('tenant switcher failed', e);
      }
    }

    function mergeTenant(t) {
      if (!t) return;
      ['display_name','sending_email','calendar_link','signature_block','value_doctrine','brand_voice','activation_message','icp_company_size','sequence_template','campaign_goal'].forEach(k => {
        if (t[k]) form[k] = t[k];
      });
      if (t.send_days) form.send_days = asArr(t.send_days);
      if (t.send_hour_from !== undefined && t.send_hour_from !== null && t.send_hour_from !== '') form.send_hour_from = Number(t.send_hour_from);
      if (t.send_hour_to !== undefined && t.send_hour_to !== null && t.send_hour_to !== '') form.send_hour_to = Number(t.send_hour_to);
      if (t.followup_custom_json) {
        try {
          const steps = typeof t.followup_custom_json === 'string' ? JSON.parse(t.followup_custom_json) : t.followup_custom_json;
          if (Array.isArray(steps) && steps.length) {
            form.sequence_steps = steps.map(normalizeSeq);
            form.sequence_template = form.sequence_template || 'custom';
          }
        } catch (e) {}
      }
      const map = {icp_industries:'icp_industries',icp_roles:'icp_roles',icp_regions:'icp_regions',pain_points:'pain_points',lead_sources:'lead_sources',campaign_channels:'campaign_channels'};
      Object.entries(map).forEach(([k, fk]) => { const a = asArr(t[k]); if (a.length) form[fk] = a; });
      const sq = asArr(t.search_queries); if (sq.length) form.search_queries = sq.join('\n');
      mergeStepData(t);
    }

    function mergeStepData(d) {
      if (!d) return;
      if (d.campaign_goal) form.campaign_goal = d.campaign_goal;
      if (d.display_name) form.display_name = d.display_name;
      if (d.sending_email) form.sending_email = d.sending_email;
      if (d.calendar_link) form.calendar_link = d.calendar_link;
      if (d.signature_block) form.signature_block = d.signature_block;
      if (d.value_doctrine) form.value_doctrine = d.value_doctrine;
      if (d.brand_voice) form.brand_voice = d.brand_voice;
      if (d.activation_message) form.activation_message = d.activation_message;
      if (d.gmail_status) form.gmail_status = d.gmail_status;
      if (d.icp_company_size) form.icp_company_size = d.icp_company_size;
      if (d.sequence_template) form.sequence_template = d.sequence_template;
      if (Array.isArray(d.sequence_steps) && d.sequence_steps.length) form.sequence_steps = d.sequence_steps.map(normalizeSeq);
      if (Array.isArray(d.send_days) && d.send_days.length) form.send_days = d.send_days;
      if (d.send_hour_from !== undefined && d.send_hour_from !== null && d.send_hour_from !== '') form.send_hour_from = Number(d.send_hour_from);
      if (d.send_hour_to !== undefined && d.send_hour_to !== null && d.send_hour_to !== '') form.send_hour_to = Number(d.send_hour_to);
      ['campaign_channels','icp_industries','icp_roles','icp_regions','pain_points','lead_sources'].forEach(k => {
        if (Array.isArray(d[k]) && d[k].length) form[k] = d[k];
      });
      if (Array.isArray(d.search_presets)) form.search_presets = d.search_presets;
      if (typeof d.search_queries === 'string') form.search_queries = d.search_queries;
    }

    function readDom() {
      document.querySelectorAll('[data-field]').forEach(el => {
        form[el.dataset.field] = el.value;
      });
      document.querySelectorAll('[data-seq-field]').forEach(el => {
        const i = Number(el.dataset.seqIdx);
        const k = el.dataset.seqField;
        if (!form.sequence_steps[i]) return;
        if (k === 'delay_days' || k === 'delay_hours') form.sequence_steps[i][k] = Math.max(0, Number(el.value) || 0);
        else form.sequence_steps[i][k] = el.value;
      });
      form.sequence_steps = form.sequence_steps.map(normalizeSeq);

    function renderChrome() {
      const idx = stepIndex();

      const isDone = current === 'running';
      document.getElementById('progress-label').textContent = isDone
        ? 'Gereed'

      document.getElementById('progress-pct').textContent = (isDone ? 100 : pct) + '%';
      document.getElementById('progress-bar').style.width = (isDone ? 100 : pct) + '%';

      const phaseOrder = ['campaign_info','settings','sequence','review'];

      document.getElementById('stepper').innerHTML = `
        <div class="stepper">
          ${phaseOrder.map((p, i) => {
            const state = i < curPhaseIdx ? 'done' : (i === curPhaseIdx ? 'active' : '');
            const isLast = i === phaseOrder.length - 1;
            return `
              <div class="step-item ${state}">
                <div class="step-dot">${i < curPhaseIdx ? '✓' : (state === 'active' ? i + 1 : i + 1)}</div>

    /* ── Sequence builder ── */

    function nodeHtml(n, i) {
      const sel = i === selectedSeqIdx ? 'selected' : '';
      const kind = n.kind === 'email' ? 'message' : n.kind;
      const meta = STEP_KIND_META[kind] || STEP_KIND_META.message;
      const grip = `<span class="node-grip" title="Sleep om te herschikken"><i class="fa-solid fa-grip-vertical"></i></span>`;
      const idx = `<span class="node-idx">${i + 1}</span>`;
      if (n.kind === 'condition') {
        const yesIdx = resolveBranchIndex(i, 'yes');
        const noIdx = resolveBranchIndex(i, 'no');
        const yesLabel = yesIdx >= 0 ? form.sequence_steps[yesIdx].title : 'Stop';
        const noLabel = noIdx >= 0 ? form.sequence_steps[noIdx].title : (noIdx === -2 ? 'Volgende (No)' : 'Stop');
        return `
          <div class="cond-node ${sel}" draggable="true" data-seq-drag="${i}" onclick="selectSeq(${i})">
            ${idx}
            <div class="diamond"><span><i class="fa-solid fa-code-branch"></i></span></div>
            <div class="min-w-0 flex-1">
              <div class="node-title">${esc(n.title)}</div>
              <div class="node-meta"><i class="fa-solid fa-circle-question"></i> ${esc((CONDITION_OPTIONS.find(c=>c.id===n.condition)||{}).label || n.condition || 'If replied')}</div>
            </div>
            ${grip}
          </div>
          <div class="branch-row" style="margin-top:4px">
            <div class="branch-col ${i===selectedSeqIdx?'yes-hl':''}" data-branch-drop="${i}" data-arm="yes" onclick="selectSeq(${i}); setTimeout(()=>{const s=document.querySelector('[data-branch-yes]'); if(s) s.focus();},50)">
              <span class="branch-badge yes">✓</span>
              <div class="text-[11px] font-semibold text-emerald-600">Yes →</div>
              <div class="text-[10px] text-ink-400 text-center truncate max-w-full">${esc(yesLabel)}</div>
              <span class="drop-label">Zet als Yes-doel</span>
            </div>
            <div class="branch-col ${i===selectedSeqIdx?'no-hl':''}" data-branch-drop="${i}" data-arm="no" onclick="selectSeq(${i}); setTimeout(()=>{const s=document.querySelector('[data-branch-no]'); if(s) s.focus();},50)">
              <span class="branch-badge no">✕</span>
              <div class="text-[11px] font-semibold text-rose-500">No →</div>
              <div class="text-[10px] text-ink-400 text-center truncate max-w-full">${esc(noLabel)}</div>
              <span class="drop-label">Zet als No-doel</span>
            </div>
          </div>`;
      }
      return `
        <button type="button" class="flow-node ${sel}" draggable="true" data-seq-drag="${i}" onclick="selectSeq(${i})">
          ${idx}
          <div class="node-icon" style="background:${meta.color}"><i class="fa-solid ${meta.icon}"></i></div>
          <div class="min-w-0 flex-1">
            <div class="node-title">${esc(n.title)}</div>
            <div class="node-meta"><i class="fa-regular fa-clock"></i> ${delayLabel(n)}</div>
          </div>
          ${grip}
        </button>`;
    }

    function renderFlowNodes() {
      const parts = [];
      form.sequence_steps.forEach((n, i) => {
        if (i > 0) {
          const prev = form.sequence_steps[i - 1];
          if (prev.kind === 'condition') {
            if (n.branch !== 'yes') parts.push(`<div class="flow-connector"></div>`);
          } else {
            parts.push(`<div class="flow-connector"></div>`);
          }
        }
        parts.push(nodeHtml(n, i));
      });
      return parts.join('');
    }

    function resolveBranchIndex(condIdx, arm) {
      const cond = form.sequence_steps[condIdx];
      if (!cond || cond.kind !== 'condition') return -1;
      const explicit = arm === 'yes' ? cond.on_true : cond.on_false;
      if (explicit === 'stop') return -1;
      if (typeof explicit === 'number' && Number.isFinite(explicit) && explicit >= 0 && explicit < form.sequence_steps.length) {
        return explicit;
      }
      return findBranchTarget(condIdx, arm);
    }

    function findBranchTarget(condIdx, arm) {
      for (let j = condIdx + 1; j < form.sequence_steps.length; j++) {
        const s = form.sequence_steps[j];
        if (arm === 'yes' && (s.branch === 'yes' || s.branch === 'true')) return j;
        if (arm === 'no' && (s.branch === 'no' || s.branch === 'false')) return j;
      }
      if (arm === 'no') {
        for (let j = condIdx + 1; j < form.sequence_steps.length; j++) {
          if (form.sequence_steps[j].branch !== 'yes') return j;
        }
        return -2; // implicit fall-through to next main step
      }
      return -1;
    }

    function renderSeqPanel() {
      const n = form.sequence_steps[selectedSeqIdx];
      if (!n) return `<div class="text-sm text-ink-500">Selecteer een stap.</div>`;

      const delayBlock = `
        <div class="field-label">Waiting time (na vorige stap)</div>
        <div class="hint mb-3">Choose when we should run this step after the previous one.</div>
        <div class="grid grid-cols-2 gap-3 mb-4">

            <div class="field-label">Days</div>
            <div class="num-input">
              <button onclick="bumpSeq('delay_days',-1)">−</button>
              <input data-seq-idx="${selectedSeqIdx}" data-seq-field="delay_days" type="number" min="0" value="${n.delay_days||0}" onchange="commitSeqField(this)" oninput="commitSeqField(this)">
              <button onclick="bumpSeq('delay_days',1)">+</button>
            </div>
          </div>
          <div>
            <div class="field-label">Hours</div>
            <div class="num-input">
              <button onclick="bumpSeq('delay_hours',-1)">−</button>
              <input data-seq-idx="${selectedSeqIdx}" data-seq-field="delay_hours" type="number" min="0" max="23" value="${n.delay_hours||0}" onchange="commitSeqField(this)" oninput="commitSeqField(this)">
              <button onclick="bumpSeq('delay_hours',1)">+</button>
            </div>
          </div>
        </div>`;

      const tools = `
        <div class="flex justify-between text-ink-400 text-sm mb-4">
          <div class="flex gap-3">
            <i class="fa-regular fa-copy" style="cursor:pointer" onclick="dupSeqStep(${selectedSeqIdx})" title="Dupliceren"></i>
            <i class="fa-regular fa-trash-can" style="cursor:pointer" onclick="removeSeqStep(${selectedSeqIdx})" title="Verwijderen"></i>
          </div>
          <span class="text-[11px] font-semibold uppercase tracking-wide">${esc((STEP_KIND_META[n.kind]||STEP_KIND_META.message).label)} #${selectedSeqIdx+1}</span>
        </div>`;

      if (n.kind === 'condition') {
        const yesIdx = resolveBranchIndex(selectedSeqIdx, 'yes');
        const noIdx = resolveBranchIndex(selectedSeqIdx, 'no');
        const stepOpts = (selectedVal, allowSelf) => {
          const opts = [];
          if (selectedVal === -2) opts.push('<option value="next" selected>Volgende (No) — impliciet</option>');
          opts.push('<option value="">Stop / geen verdere stappen</option>');
          form.sequence_steps.forEach((s, idx) => {
            if (!allowSelf && idx === selectedSeqIdx) return;
            opts.push(`<option value="${idx}" ${String(selectedVal)===String(idx)?'selected':''}>#${idx+1} · ${esc(s.title)}${idx===selectedSeqIdx?' (deze)':''}</option>`);
          });
          return opts.join('');
        };
        return `
          <div class="flex items-center justify-between mb-4">
            <div class="font-bold text-ink-900">${esc(n.title)}</div>
            ${tools}
          </div>
          <div class="field-label">Titel</div>
          <input class="field-input mb-4" data-seq-idx="${selectedSeqIdx}" data-seq-field="title" value="${esc(n.title)}" onchange="commitSeqField(this)">
          <div class="field-label">Voorwaarde (if)</div>
          <select class="field-input mb-4" data-seq-idx="${selectedSeqIdx}" data-seq-field="condition" onchange="commitSeqField(this)">
            ${CONDITION_OPTIONS.map(c => `<option value="${c.id}" ${n.condition===c.id?'selected':''}>${c.label}</option>`).join('')}
          </select>
          ${delayBlock}
          <div class="field-label">Yes → ga naar</div>
          <select class="field-input mb-3" data-branch-yes onchange="setBranchTarget(${selectedSeqIdx},'yes',this.value)">
            ${stepOpts(yesIdx, false)}
          </select>
          <div class="field-label">No → ga naar</div>
          <select class="field-input mb-3" data-branch-no onchange="setBranchTarget(${selectedSeqIdx},'no',this.value)">
            ${stepOpts(noIdx, false)}
          </select>
          <div class="text-xs text-ink-400">Leeg = stop (goal bereikt). Stappen na de voorwaarde zonder tak-label volgen de No-lijn. Je mag elke latere stap als doel kiezen.</div>`;
      }

      if (n.kind === 'wait') {
        return `
          <div class="flex items-center justify-between mb-4">
            <div class="font-bold text-ink-900">${esc(n.title)}</div>
            ${tools}
          </div>
          <div class="field-label">Titel</div>
          <input class="field-input mb-4" data-seq-idx="${selectedSeqIdx}" data-seq-field="title" value="${esc(n.title)}" onchange="commitSeqField(this)">
          ${delayBlock}
          <div class="text-xs text-ink-400">Wacht stap: niets sturen — alleen time-boxed doorstromen naar de volgende actie.</div>`;
      }

      if (n.kind === 'linkedin_connect') {
        return `
          <div class="flex items-center justify-between mb-4">
            <div class="font-bold text-ink-900">${esc(n.title)}</div>
            ${tools}
          </div>
          <div class="field-label">Titel</div>
          <input class="field-input mb-4" data-seq-idx="${selectedSeqIdx}" data-seq-field="title" value="${esc(n.title)}" onchange="commitSeqField(this)">
          <div class="field-label">Connectie-notitie (optioneel, max ~180 tekens)</div>
          <textarea class="field-input mb-4" rows="3" data-seq-idx="${selectedSeqIdx}" data-seq-field="note" placeholder="Laat leeg voor AI-notitie..." onchange="commitSeqField(this)">${esc(n.note||'')}</textarea>
          ${delayBlock}`;
      }

      if (n.kind === 'linkedin_message') {
        return `
          <div class="flex items-center justify-between mb-4">
            <div class="font-bold text-ink-900">${esc(n.title)}</div>
            ${tools}
          </div>
          <div class="field-label">Titel</div>
          <input class="field-input mb-4" data-seq-idx="${selectedSeqIdx}" data-seq-field="title" value="${esc(n.title)}" onchange="commitSeqField(this)">
          <div class="field-label">Bericht (optioneel — AI vult aan)</div>
          <textarea class="field-input mb-4" rows="5" data-seq-idx="${selectedSeqIdx}" data-seq-field="message" placeholder="Hoi {{first_name}}, ..." onchange="commitSeqField(this)">${esc(n.message||'')}</textarea>
          ${delayBlock}`;
      }

      return `
        <div class="flex items-center justify-between mb-4">
          <div class="font-bold text-ink-900">${esc(n.title)}</div>
          ${tools}
        </div>
        <div class="field-label">Titel</div>
        <input class="field-input mb-4" data-seq-idx="${selectedSeqIdx}" data-seq-field="title" value="${esc(n.title)}" onchange="commitSeqField(this)">
        <div class="field-label">Onderwerp (optioneel)</div>
        <input class="field-input mb-4" data-seq-idx="${selectedSeqIdx}" data-seq-field="subject" value="${esc(n.subject||'')}" onchange="commitSeqField(this)">
        <div class="field-label">Onderwerp-prefix</div>
        <input class="field-input mb-4" data-seq-idx="${selectedSeqIdx}" data-seq-field="subject_prefix" value="${esc(n.subject_prefix||'Re: ')}" onchange="commitSeqField(this)">
        <div class="field-label">Toon</div>
        <select class="field-input mb-4" data-seq-idx="${selectedSeqIdx}" data-seq-field="tone" onchange="commitSeqField(this)">
          ${TONE_OPTIONS.map(t => `<option value="${t}" ${n.tone===t?'selected':''}>${t}</option>`).join('')}
        </select>
        <div class="field-label">Message (optioneel — AI vult aan)</div>
        <textarea class="field-input mb-4" rows="5" data-seq-idx="${selectedSeqIdx}" data-seq-field="message" placeholder="Laat leeg voor AI-tekst..." onchange="commitSeqField(this)">${esc(n.message||'')}</textarea>
        ${delayBlock}`;
    }

    let seqSaveTimer = null;
    function scheduleSequenceSave() {
      clearTimeout(seqSaveTimer);
      seqSaveTimer = setTimeout(() => { savePhase('sequence'); }, 400);
    }

    function commitSeqField(el) {
      const i = Number(el.dataset.seqIdx);
      const k = el.dataset.seqField;
      if (!form.sequence_steps[i]) return;
      if (k === 'delay_days' || k === 'delay_hours') {
        form.sequence_steps[i][k] = Math.max(0, Math.floor(Number(el.value) || 0));
        clampDelay(form.sequence_steps[i]);
        if (k === 'delay_hours' && el.value !== String(form.sequence_steps[i].delay_hours)) {
          el.value = String(form.sequence_steps[i].delay_hours);
        }
        if (k === 'delay_days' && el.value !== String(form.sequence_steps[i].delay_days)) {
          el.value = String(form.sequence_steps[i].delay_days);
        }
      } else form.sequence_steps[i][k] = el.value;
      form.sequence_steps = form.sequence_steps.map(normalizeSeq);
      form.sequence_template = form.sequence_template || 'custom';
      scheduleSequenceSave();
      // refresh node meta without full panel re-render (keep focus in input)
      const flow = document.getElementById('flowSteps');
      if (flow) flow.innerHTML = renderFlowNodes();
      bindFlowDragHandlers();
    }

    function selectSeq(i) {
      readDom();
      selectedSeqIdx = i;
      render();
    }
    function bumpSeq(field, delta) {
      readDom();
      const n = form.sequence_steps[selectedSeqIdx];
      if (!n) return;
      n[field] = Math.max(0, Math.floor(Number(n[field] || 0) + delta));
      clampDelay(n);
      form.sequence_steps = form.sequence_steps.map(normalizeSeq);
      form.sequence_template = form.sequence_template || 'custom';
      scheduleSequenceSave();
      render();
    }
    function addSeqStep(kind) {
      readDom();
      const k = kind || 'message';
      const msgCount = form.sequence_steps.filter(s => s.kind === 'message').length + 1;
      const defaults = {
        message: { kind:'message', title:`E-mail ${msgCount}`, delay_days:2, delay_hours:0, tone:'gentle', subject_prefix:'Re: ', message:'' },
        wait: { kind:'wait', title:'Wacht', delay_days:2, delay_hours:0 },
        linkedin_connect: { kind:'linkedin_connect', title:'LinkedIn connectieverzoek', delay_days:0, delay_hours:0, note:'' },
        linkedin_message: { kind:'linkedin_message', title:'LinkedIn DM', delay_days:1, delay_hours:0, message:'' },
        condition: { kind:'condition', title:'If / else', delay_days:0, delay_hours:0, condition:'email_replied' },
      };
      form.sequence_steps.push({ ...(defaults[k] || defaults.message) });
      form.sequence_steps = form.sequence_steps.map(normalizeSeq);
      selectedSeqIdx = form.sequence_steps.length - 1;
      form.sequence_template = 'custom';
      scheduleSequenceSave();
      render();
    }
    function insertSeqStepAfter() {
      readDom();
      const at = selectedSeqIdx;
      const msgCount = form.sequence_steps.filter(s => s.kind === 'message').length + 1;
      const step = { kind:'message', title:`E-mail ${msgCount}`, delay_days:2, delay_hours:0, tone:'gentle', subject_prefix:'Re: ', message:'' };
      form.sequence_steps.forEach(s => {
        if (s.kind !== 'condition') return;
        const fix = (v) => (typeof v === 'number' && Number.isFinite(v) && v > at) ? v + 1 : v;
        s.on_true = fix(s.on_true);
        s.on_false = fix(s.on_false);
      });
      form.sequence_steps.splice(at + 1, 0, step);
      form.sequence_steps = form.sequence_steps.map(normalizeSeq);
      rebuildBranchTags();
      selectedSeqIdx = at + 1;
      form.sequence_template = 'custom';
      scheduleSequenceSave();
      render();
    }
    function rebuildBranchTags() {
      form.sequence_steps.forEach(s => { delete s.branch; });
      form.sequence_steps.forEach(c => {
        if (c.kind !== 'condition') return;
        if (c.on_true != null && form.sequence_steps[c.on_true]) {
          form.sequence_steps[c.on_true].branch = 'yes';
        }
        if (c.on_false != null && form.sequence_steps[c.on_false] && form.sequence_steps[c.on_false].branch !== 'yes') {
          form.sequence_steps[c.on_false].branch = 'no';
        }
      });
    }
    function setBranchTarget(condIdx, arm, val) {
      readDom();
      // Dropdown value '' = explicit "Stop / geen verdere stappen" → sentinel
      // 'stop' (null stays = untouched, letting the engine apply its default).
      let target;
      if (val === '') target = 'stop';
      else if (val === 'next' || val == null || val === 'undefined') target = null;
      else target = Number(val);
      const cond = form.sequence_steps[condIdx];
      if (!cond || cond.kind !== 'condition') return;
      const t = target === 'stop' ? 'stop' : (Number.isFinite(target) ? target : null);
      if (arm === 'yes') cond.on_true = t;
      else cond.on_false = t;
      form.sequence_steps = form.sequence_steps.map(normalizeSeq);
      rebuildBranchTags();
      form.sequence_template = 'custom';
      selectedSeqIdx = condIdx;
      scheduleSequenceSave();
      render();
    }
    function removeSeqStep(i) {
      readDom();
      if (form.sequence_steps.length <= 1) return;
      form.sequence_steps.splice(i, 1);
      form.sequence_steps.forEach(s => {
        if (s.kind !== 'condition') return;
        const fix = (v) => {
          if (v === 'stop') return 'stop';
          if (typeof v !== 'number' || v == null) return null;
          if (v === i) return null;
          return v > i ? v - 1 : v;
        };
        s.on_true = fix(s.on_true);
        s.on_false = fix(s.on_false);
      });
      rebuildBranchTags();
      selectedSeqIdx = Math.max(0, Math.min(selectedSeqIdx, form.sequence_steps.length - 1));
      form.sequence_template = 'custom';
      scheduleSequenceSave();
      render();
    }
    function dupSeqStep(i) {
      readDom();
      const copy = {...form.sequence_steps[i]};
      form.sequence_steps.splice(i + 1, 0, copy);
      form.sequence_steps.forEach((s, idx) => {
        if (s.kind !== 'condition') return;
        const shift = (v) => {
          if (v === 'stop') return 'stop';
          if (typeof v !== 'number' || v == null) return null;
          return v > i ? v + 1 : v;
        };
        s.on_true = shift(s.on_true);
        s.on_false = shift(s.on_false);
      });
      rebuildBranchTags();
      selectedSeqIdx = i + 1;
      form.sequence_template = 'custom';
      scheduleSequenceSave();
      render();
    }
    function moveSeqStep(from, to) {
      readDom();
      if (from === to || from < 0 || to < 0 || from >= form.sequence_steps.length || to >= form.sequence_steps.length) return;
      const [item] = form.sequence_steps.splice(from, 1);
      form.sequence_steps.splice(to, 0, item);
      form.sequence_steps.forEach(s => {
        if (s.kind !== 'condition') return;
        const remap = (v) => {
          if (v === 'stop') return 'stop';
          if (typeof v !== 'number' || v == null || !Number.isFinite(v)) return null;
          if (v === from) return to;
          if (from < to && v > from && v <= to) return v - 1;
          if (from > to && v >= to && v < from) return v + 1;
          return v;
        };
        s.on_true = remap(s.on_true);
        s.on_false = remap(s.on_false);
      });
      form.sequence_steps = form.sequence_steps.map(normalizeSeq);
      rebuildBranchTags();
      selectedSeqIdx = to;
      form.sequence_template = 'custom';
      scheduleSequenceSave();
      render();
    }
    function loadTemplate(id) {
      readDom();
      form.sequence_template = id;
      form.sequence_steps = SEQ_TEMPLATES[id].map(s => ({...s}));
      selectedSeqIdx = 0;
      scheduleSequenceSave();
      render();
    }

    /* Drag & drop reorder + branch targets */
    let seqDragFrom = null;
    function bindFlowDragHandlers() {
      const nodes = document.querySelectorAll('[data-seq-drag]');
      nodes.forEach(el => {
        if (el.dataset.dndBound === '1') return;
        el.dataset.dndBound = '1';
        el.addEventListener('dragstart', e => {
          seqDragFrom = Number(el.dataset.seqDrag);
          el.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', String(seqDragFrom)); } catch (err) {}
          e.stopPropagation();
        });
        el.addEventListener('dragend', () => {
          el.classList.remove('dragging');
          document.querySelectorAll('.flow-node,.cond-node').forEach(n => n.classList.remove('drag-over-top','drag-over-bottom','dragging'));
          document.querySelectorAll('.branch-col').forEach(b => b.classList.remove('drag-over-yes','drag-over-no'));
          seqDragFrom = null;
        });
        el.addEventListener('dragover', e => {
          e.preventDefault();
          e.stopPropagation();
          const rect = el.getBoundingClientRect();
          const mid = rect.top + rect.height / 2;
          el.classList.toggle('drag-over-top', e.clientY < mid);
          el.classList.toggle('drag-over-bottom', e.clientY >= mid);
        });
        el.addEventListener('dragleave', () => {
          el.classList.remove('drag-over-top','drag-over-bottom');
        });
        el.addEventListener('drop', e => {
          e.preventDefault();
          e.stopPropagation();
          el.classList.remove('drag-over-top','drag-over-bottom');
          const toIdx = Number(el.dataset.seqDrag);
          const from = seqDragFrom != null ? seqDragFrom : Number(e.dataTransfer.getData('text/plain'));
          if (!Number.isFinite(from) || !Number.isFinite(toIdx) || from === toIdx) return;
          moveSeqStep(from, toIdx);
        });
      });

      document.querySelectorAll('[data-branch-drop]').forEach(el => {
        if (el.dataset.dndBound === '1') return;
        el.dataset.dndBound = '1';
        const arm = el.dataset.arm;
        const condIdx = Number(el.dataset.branchDrop);
        el.addEventListener('dragover', e => {
          if (seqDragFrom == null && !e.dataTransfer) return;
          e.preventDefault();
          e.stopPropagation();
          el.classList.toggle(arm === 'yes' ? 'drag-over-yes' : 'drag-over-no', true);
        });
        el.addEventListener('dragleave', () => {
          el.classList.remove('drag-over-yes','drag-over-no');
        });
        el.addEventListener('drop', e => {
          e.preventDefault();
          e.stopPropagation();
          el.classList.remove('drag-over-yes','drag-over-no');
          const from = seqDragFrom != null ? seqDragFrom : Number(e.dataTransfer.getData('text/plain'));
          if (!Number.isFinite(from) || from === condIdx) return;
          setBranchTarget(condIdx, arm, String(from));
        });
      });

      const canvas = document.querySelector('.flow-canvas');
      if (canvas && canvas.dataset.dndBound !== '1') {
        canvas.dataset.dndBound = '1';
        canvas.addEventListener('dragover', e => { e.preventDefault(); });
        canvas.addEventListener('drop', e => {
          if (e.target.closest('[data-seq-drag]') || e.target.closest('[data-branch-drop]')) return;
          // drop on empty canvas → move to end
          const from = seqDragFrom != null ? seqDragFrom : Number(e.dataTransfer.getData('text/plain'));
          if (Number.isFinite(from)) moveSeqStep(from, form.sequence_steps.length - 1);
        });
      }
    }

    async function savePhase(phase, extra = {}) {
      readDom();
      const payload = { step: phase, data: { ...extra } };
      if (phase === 'campaign_info') {
        payload.data = {
          campaign_goal: form.campaign_goal,
          display_name: form.display_name,
          sending_email: form.sending_email,
          calendar_link: form.calendar_link,
          signature_block: form.signature_block,
          value_doctrine: form.value_doctrine,
          brand_voice: form.brand_voice,
          activation_message: form.activation_message,
          pain_points: form.pain_points,
        };
      }
      if (phase === 'settings') {
        payload.data = {
          campaign_channels: form.campaign_channels,
          gmail_status: form.gmail_status,
          icp_industries: form.icp_industries,
          icp_roles: form.icp_roles,
          icp_company_size: form.icp_company_size,
          icp_regions: form.icp_regions,
          lead_sources: form.lead_sources,
          search_presets: form.search_presets,
          search_queries: form.search_queries,
          send_days: form.send_days,
          send_hour_from: form.send_hour_from,
          send_hour_to: form.send_hour_to,
        };
      }
      if (phase === 'sequence') {
        payload.data = {
          sequence_template: form.sequence_template,
          sequence_steps: form.sequence_steps,
          send_days: form.send_days,
          send_hour_from: form.send_hour_from,
          send_hour_to: form.send_hour_to,
        };
      }
      try {
        const res = await fetch('/api/onboarding/step', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        return res.ok;
      } catch (e) {
        console.error('save step failed', e);
        return false;
      }
    }

    async function next() {
      readDom();
      if (current === 'goal') {
        if (!form.campaign_goal) { alert('Kies een doel om door te gaan.'); return; }
        current = 'company';
        render();
        return;
      }
      if (current === 'company') {
        if (!form.display_name || !form.sending_email) {
          alert('Vul bedrijfsnaam en e-mailadres in.');
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.sending_email)) {
          alert('Vul een geldig e-mailadres in (bijv. naam@bedrijf.nl).');
          return;
        }
        const saved = await savePhase('campaign_info');
        if (!saved) alert('Kon campagne-info niet opslaan — probeer opnieuw of check de server.');
        current = 'settings';
        settingsTab = 'email';
        render();
        return;
      }
      if (current === 'settings') {
        if (!form.campaign_channels.length) { alert('Kies minimaal één kanaal.'); return; }
        if (!form.lead_sources.length) { alert('Kies minimaal één leadbron (Global settings).'); settingsTab = 'global'; render(); return; }
        if (!form.send_days.length) { alert('Kies minimaal één verzenddag.'); settingsTab = 'email'; render(); return; }
        const saved = await savePhase('settings');
        if (!saved) alert('Kon instellingen niet opslaan — probeer opnieuw of check de server.');
        current = 'sequence';
        selectedSeqIdx = 0;
        render();
        return;
      }
      if (current === 'sequence') {
        if (!form.sequence_steps.length) { alert('Voeg minimaal één berichtstap toe.'); return; }
        const ok = await savePhase('sequence');
        if (!ok) alert('Kon de sequentie niet opslaan — controleer de server.');
        current = 'review';
        render();
        return;
      }
      if (current === 'review') {
        await launch();
      }
    }

    function back() {
      readDom();
      const idx = stepIndex();
      if (idx <= 0) return;
      current = STEPS[idx - 1];
      if (current === 'settings') settingsTab = 'email';
      render();

        send_days: form.send_days,
        send_hour_from: Number(form.send_hour_from),
        send_hour_to: Number(form.send_hour_to),
        lead_sources: form.lead_sources,
        search_queries: [...new Set([...form.search_presets, ...(form.search_queries || '').split('\n').map(s => s.trim()).filter(Boolean)])],
        campaign_name: `${form.display_name} campagne`,
        create_campaign: true,
      };
      try {
        await savePhase('sequence');
        const res = await fetch('/api/onboarding/launch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('launch failed: HTTP ' + res.status);
        launchResult = await res.json();
        current = 'running';
        render();
        // Lead sourcing only — sequence graph owns send/follow-up (no double-send)
        try { await fetch('/api/pipeline/start', { method: 'POST' }); } catch (e) { console.warn('pipeline start', e); }
      } catch (e) {
        console.error(e);
        alert('Lanceren mislukt. Controleer de logs.');
        if (btn) { btn.disabled = false; btn.textContent = 'Lanceer campagne'; }
      }
    }

    async function connectGmail() {
      readDom();
      try {
        const res = await fetch('/api/onboarding/connect-gmail', { method: 'POST' });
        const data = await res.json();
        if (data.status === 'error') {
          form.gmail_status = 'Mislukt: ' + (data.message || 'OAuth niet beschikbaar.');
        } else {
          form.gmail_status = '✓ ' + (data.message || 'Controleer je browser om de koppeling te voltooien.');
        }
      } catch (e) {
        form.gmail_status = 'Koppeling mislukt — probeer het later vanaf het dashboard.';
      }
      render();
    }

    async function connectEmailAppPassword() {
      readDom();
      const emailEl = document.getElementById('cx_email');
      const passEl = document.getElementById('cx_password');
      const email = (emailEl && emailEl.value || '').trim();
      const password = (passEl && passEl.value) || '';
      if (!email || !password) {
        form.gmail_status = 'Vul je e-mailadres en app-wachtwoord in.';
        render();
        return;
      }
      const btn = document.getElementById('cx_btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Controleren…'; }
      try {
        const res = await fetch('/api/onboarding/connect-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          form.sending_email = data.email || email;
          form.gmail_status = data.imap_ok
            ? '✓ Geverifieerd — SMTP + IMAP werken. Inkomende antwoorden worden meegeluisterd.'
            : '✓ Verzenden werkt (SMTP). IMAP kon niet inloggen — zet IMAP aan in Google Instellingen.';
          if (passEl) passEl.value = '';
        } else {
          form.gmail_status = 'Mislukt: ' + (data.detail || data.error || 'controleer e-mail en app-wachtwoord');
        }
      } catch (e) {
        form.gmail_status = 'Mislukt: geen verbinding met het dashboard.';
      }
      if (btn) { btn.disabled = false; btn.textContent = 'Verbind (app-wachtwoord)'; }
      await loadConnectStatus();
      render();
    }

    // --- LinkedIn QR connect (tenant's own account) ---
    let liQrTimer = null;
    let liQrTicks = 0;

    function liQrSet(state, msg) {
      const dot = document.getElementById('li_qr_dot');
      const badge = document.getElementById('li_qr_badge');
      const msgEl = document.getElementById('li_qr_msg');
      if (!dot || !badge || !msgEl) return;
      const map = {
        waiting: ['bg-amber-400', 'Scannen…', 'text-amber-600', '…'],
        success: ['bg-brand-600', 'Verbonden', 'text-brand-600', '✓'],
        error: ['bg-red-500', 'Fout', 'text-red-600', '!'],
        expired: ['bg-red-400', 'Verlopen', 'text-red-500', '!'],
        idle: ['bg-slate-300', 'Niet verbonden', 'text-ink-400', '!'],
      };
      const m = map[state] || map.idle;
      dot.className = 'w-4 h-4 shrink-0 rounded ' + m[0] + ' text-white text-[10px] flex items-center justify-center';
      dot.textContent = m[3];
      badge.textContent = m[1];
      badge.className = 'text-xs ' + m[2];
      msgEl.textContent = msg || m[1];
    }

    function liQrShowArea(show) {
      const area = document.getElementById('li_qr_area');
      if (area) area.classList.toggle('hidden', !show);
    }

    function liQrEndPoll() {
      clearInterval(liQrTimer);
      liQrTimer = null;
      const btn = document.getElementById('li_qr_btn');
      if (btn) btn.disabled = false;
      const stop = document.getElementById('li_qr_stop');
      if (stop) stop.classList.add('hidden');
    }

    async function initLiQrCard() {
      if (!document.getElementById('li_qr_btn')) return;
      if (liQrTimer) {
        liQrShowArea(true);
        const stop = document.getElementById('li_qr_stop');
        if (stop) stop.classList.remove('hidden');
        liQrSet('waiting', 'Scan de QR-code met je telefoon…');
        return;
      }
      try {
        const st = await (await fetch('/api/linkedin/tenant-status')).json();
        if (st.logged_in) liQrSet('success', 'LinkedIn verbonden');
        else liQrSet('idle', 'Nog geen LinkedIn verbonden');
      } catch (e) {
        liQrSet('idle', 'Nog geen LinkedIn verbonden');
      }
    }

    async function startTenantQrFlow() {
      const btn = document.getElementById('li_qr_btn');
      if (btn) btn.disabled = true;
      try {
        const r = await fetch('/api/linkedin/tenant-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}',
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status));
        if (j.status === 'error') throw new Error(j.message || 'Kon QR-scan niet starten');
        liQrShowArea(true);
        liQrSet('waiting', 'Scan de QR-code met je telefoon…');
        const stop = document.getElementById('li_qr_stop');
        if (stop) stop.classList.remove('hidden');
        liQrBeginPoll();
      } catch (e) {
        liQrSet('error', e.message || String(e));
        if (btn) btn.disabled = false;
      }
    }

    function liQrBeginPoll() {
      clearInterval(liQrTimer);
      liQrTicks = 0;
      liQrTimer = setInterval(async () => {
        liQrTicks++;
        try {
          const st = await (await fetch('/api/linkedin/tenant-status')).json();
          const img = document.getElementById('li_qr_img');
          if (img) {
            const res = await fetch('/api/linkedin/tenant-qr?t=' + Date.now());
            if (res.ok) {
              const blob = await res.blob();
              img.src = URL.createObjectURL(blob);
            }
          }
          if (st.status === 'success' || st.logged_in) {
            liQrEndPoll();
            liQrSet('success', 'LinkedIn verbonden');
            liQrShowArea(false);
          } else if (st.status === 'error') {
            liQrEndPoll();
            liQrSet('error', st.message || 'Fout');
            liQrShowArea(false);
          } else if (st.status === 'expired') {
            liQrEndPoll();
            liQrSet('expired', 'QR verlopen — start opnieuw');
            liQrShowArea(false);
          } else if (st.status === 'idle' && liQrTicks > 4) {
            liQrEndPoll();
            liQrSet('idle', 'Gestopt');
            liQrShowArea(false);
          } else {
            liQrSet('waiting', 'Scan de QR-code met je telefoon…');
          }
        } catch (e) { /* transient poll error — keep trying */ }
        if (liQrTicks > 96) {
          liQrEndPoll();
          liQrSet('expired', 'QR verlopen — start opnieuw');
          liQrShowArea(false);
        }
      }, 2500);
    }

    async function stopTenantQrFlow() {
      try {
        await fetch('/api/linkedin/tenant-qr-stop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}',
        });
      } catch (e) { /* ignore */ }
      liQrEndPoll();
      liQrSet('idle', 'Gestopt');
      liQrShowArea(false);
    }

    // --- Re-edit a launched sequence (update-in-place, keeps enrollment progress) ---
    async function editLaunchedSequence() {
      try {
        const r = await fetch('/api/sequence-graph/active');
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          alert('Sequence laden mislukt: ' + (j.detail || ('HTTP ' + r.status)));
          return;
        }
        const j = await r.json();
        if (!j.steps || !j.steps.length) {
          alert('Geen actieve sequence gevonden om te bewerken.');
          return;
        }
        form.sequence_steps = j.steps.map((s, i) => normalizeSeq(s, i));
        form.sequence_template = 'custom';
        editingLaunched = true;
        seqApplyNote = '';
        selectedSeqIdx = 0;
        current = 'sequence';
        render();
      } catch (e) {
        alert('Sequence laden mislukt: ' + (e.message || e));
      }
    }

    function cancelSequenceEdit() {
      editingLaunched = false;
      current = 'running';
      render();
    }

    async function applyLaunchedEdit() {
      readDom();
      const btn = document.getElementById('applySeqBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Toepassen…'; }
      try {
        await savePhase('sequence');
        const r = await fetch('/api/sequence-graph/update', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sequence_steps: form.sequence_steps }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status));
        editingLaunched = false;
        seqApplyNote = '✓ Sequence bijgewerkt — actieve leads blijven hun huidige stap volgen.';
        current = 'running';
        render();
      } catch (e) {
        alert('Toepassen mislukt: ' + (e.message || e));
        if (btn) { btn.disabled = false; btn.textContent = 'Wijzigingen toepassen'; }
      }
    }

    init();
  </script>
</body>
</html>
